<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Study Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#1f2937}
header{background:#17365d;color:#fff;text-align:center;padding:24px 15px}
header h1{margin:0 0 7px;font-size:28px}
header p{margin:4px 0}
.container{max-width:900px;margin:24px auto;padding:0 15px}
.panel,.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:18px}
label{font-weight:bold;display:block;margin-bottom:8px}
select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}
button{border:0;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer;background:#17365d;color:#fff}
button:hover{opacity:.9}
button:disabled{cursor:not-allowed;opacity:.9}
.secondary{background:#64748b}
.start{margin-top:14px}
.subject{font-size:14px;font-weight:bold;color:#2563eb;margin-bottom:8px}
.progress{font-size:14px;color:#64748b;margin:8px 0}
.bar{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-bottom:22px}
.fill{height:100%;width:0;background:#2563eb;transition:.2s}
.question{font-size:20px;font-weight:bold;line-height:1.5;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#f8fafc;color:#1f2937;border:1px solid #cbd5e1}
.option.correct{background:#dcfce7;border-color:#16a34a;color:#166534}
.option.wrong{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.feedback{display:none;margin-top:15px;padding:12px;border-radius:8px;font-weight:bold}
.feedback.show{display:block}
.feedback.correct{background:#dcfce7;color:#166534}
.feedback.wrong{background:#fee2e2;color:#991b1b}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.note{font-size:13px;color:#64748b;margin-top:12px;line-height:1.5}
.hidden{display:none}
@media(max-width:600px){header h1{font-size:23px}.question{font-size:18px}.panel,.card{padding:17px}}
</style>
</head>
<body>
<header>
<h1>MCQ Study Portal</h1>
<p>Study Mode – Individual Subjects</p>
<p style="font-weight:bold">Subject Handled Staff: R. Sankara Narayanan</p>
</header>

<div class="container">
<div class="panel">
<label for="subjectSelect">Select Subject</label>
<select id="subjectSelect">
<option value="">-- Select a Subject --</option>
<option value="IDT">Innovation &amp; Design Thinking</option>
<option value="WDF">Web Fundamentals and HTML</option>
<option value="IOT">Internet of Things</option>
<option value="DBMS">Database Management System</option>
</select>
<button class="start" onclick="startStudy()">Start Study</button>
<div class="note">Each subject contains 50 questions. Questions are shuffled within the selected subject.</div>
</div>

<div id="studyCard" class="card hidden">
<div class="subject" id="subjectName"></div>
<div class="progress" id="progress"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div id="feedback" class="feedback"></div>
<div class="nav">
<button class="secondary" onclick="previousQuestion()">Previous</button>
<button onclick="nextQuestion()">Next</button>
</div>
</div>
</div>

<script>
const banks = {"IDT": [{"q": "Which of the following best describes innovation?", "o": ["Repeating an existing idea without changes", "Applying new ideas to create value or solve problems", "Memorizing existing information", "Avoiding changes in existing systems"], "a": 1}, {"q": "What is the main purpose of creativity in the innovation process?", "o": ["To generate new and useful ideas", "To eliminate all possible ideas", "To follow existing solutions only", "To reduce the number of alternatives"], "a": 0}, {"q": "Which of the following is an important characteristic of an innovative idea?", "o": ["It must always be expensive", "It should provide value or solve a problem", "It must use advanced technology", "It should never be modified"], "a": 1}, {"q": "Why is innovation important for organizations?", "o": ["It helps organizations avoid customer needs", "It helps organizations develop better products and solutions", "It prevents competition", "It eliminates the need for creativity"], "a": 1}, {"q": "Design Thinking primarily focuses on:", "o": ["Technology-centered solutions", "User-centered problem solving", "Increasing production speed only", "Reducing communication"], "a": 1}, {"q": "Which of the following is generally considered the first stage of Design Thinking?", "o": ["Ideate", "Prototype", "Empathize", "Test"], "a": 2}, {"q": "The main objective of the Empathize stage is to:", "o": ["Understand the users and their experiences", "Develop the final product immediately", "Select the cheapest solution", "Test the final prototype"], "a": 0}, {"q": "Which Design Thinking stage involves clearly defining the problem based on user needs and observations?", "o": ["Empathize", "Define", "Prototype", "Test"], "a": 1}, {"q": "Which stage of Design Thinking focuses on generating a wide range of possible solutions?", "o": ["Define", "Ideate", "Test", "Empathize"], "a": 1}, {"q": "A prototype in Design Thinking is mainly used to:", "o": ["Create the final product directly", "Test and communicate an idea", "Replace user research", "Avoid experimentation"], "a": 1}, {"q": "The main purpose of the Test stage is to:", "o": ["Understand how users respond to a solution", "Stop the design process", "Generate the initial problem", "Avoid user feedback"], "a": 0}, {"q": "A user-centric approach means:", "o": ["Designing products based only on company preferences", "Designing solutions around user needs and experiences", "Ignoring user feedback", "Focusing only on production cost"], "a": 1}, {"q": "Which activity is most useful for understanding how users behave in their real environment?", "o": ["Observation", "Advertising", "Budgeting", "Programming"], "a": 0}, {"q": "Empathy mapping is mainly used to:", "o": ["Understand a user's thoughts, feelings, actions, and experiences", "Calculate manufacturing costs", "Create financial statements", "Measure computer performance"], "a": 0}, {"q": "Which of the following is commonly included in an empathy map?", "o": ["Says", "Thinks", "Does", "All of the above"], "a": 3}, {"q": "Problem identification in Design Thinking should primarily focus on:", "o": ["The actual needs and difficulties of users", "The designer's personal preferences", "The most expensive solution", "The latest available technology"], "a": 0}, {"q": "Which creative thinking technique encourages generating many ideas without immediately judging them?", "o": ["Brainstorming", "Debugging", "Auditing", "Benchmarking"], "a": 0}, {"q": "What is the main purpose of brainstorming?", "o": ["To generate a large number of ideas", "To select one idea immediately", "To reject unusual ideas", "To avoid group participation"], "a": 0}, {"q": "Which of the following helps designers understand a problem from the user's point of view?", "o": ["Empathy", "Automation", "Accounting", "Optimization"], "a": 0}, {"q": "Which statement best describes the relationship between creativity and innovation?", "o": ["Creativity generates ideas, while innovation applies ideas to create value", "Creativity and innovation are exactly the same", "Innovation eliminates the need for creativity", "Creativity is useful only in artistic activities"], "a": 0}, {"q": "A college notices that students frequently wait for a long time at the canteen during lunch. A Design Thinking team observes students, interviews them, and studies their difficulties before proposing solutions. Which principle is primarily being followed?", "o": ["Technology-first approach", "User-centric approach", "Cost-centric approach", "Production-centric approach"], "a": 1}, {"q": "During an empathy study, students say that the online attendance system is \"confusing,\" but their actual behavior shows that they frequently ask classmates for help. What does this observation suggest?", "o": ["User statements should always be ignored", "User behavior can provide additional insights beyond what users explicitly say", "The system should immediately be replaced", "Interviews are unnecessary in Design Thinking"], "a": 1}, {"q": "A design team identifies the problem as \"Students need a better mobile application.\" Later, after user research, they redefine it as \"Students need a simple way to receive timely information about classroom changes.\" Why is the second problem statement better?", "o": ["It focuses on a specific technology", "It focuses on an underlying user need", "It completely avoids the user", "It provides a final solution immediately"], "a": 1}, {"q": "During brainstorming, one team member suggests an unusual idea. Other members immediately criticize it, and no further ideas are generated. Which principle of creative thinking has been violated?", "o": ["Delaying judgment during idea generation", "Focusing only on existing solutions", "Reducing the number of ideas", "Selecting the final prototype immediately"], "a": 0}, {"q": "A team develops a prototype, receives negative feedback from users, modifies the design, and tests it again. What important characteristic of Design Thinking is demonstrated?", "o": ["Design Thinking is a strictly linear process", "Design Thinking is iterative and uses feedback for improvement", "User feedback is used only after final development", "Prototyping eliminates the need for testing"], "a": 1}, {"q": "Which of the following best distinguishes creativity from innovation?", "o": ["Creativity focuses on generating ideas, while innovation focuses on implementing useful ideas", "Creativity is only related to technology", "Innovation does not require ideas", "Creativity always produces a commercial product"], "a": 0}, {"q": "Which factor can strongly encourage innovation within an organization?", "o": ["Fear of failure", "Openness to new ideas", "Avoidance of experimentation", "Strictly following existing methods"], "a": 1}, {"q": "An invention becomes an innovation when it:", "o": ["Is kept as a theoretical concept", "Is applied successfully to create value", "Is stored without being used", "Is copied from another person"], "a": 1}, {"q": "Which of the following is most likely to prevent creativity?", "o": ["Open discussion", "Multiple perspectives", "Fear of criticism", "Free exchange of ideas"], "a": 2}, {"q": "What is the primary purpose of Design Thinking?", "o": ["To find solutions based only on technical feasibility", "To solve complex problems by understanding people and their needs", "To eliminate the need for experimentation", "To produce solutions without research"], "a": 1}, {"q": "Which activity is most closely associated with the Define stage of Design Thinking?", "o": ["Framing the core user problem", "Building a physical model", "Conducting final product testing", "Launching the product"], "a": 0}, {"q": "What is the main characteristic of the Ideate stage?", "o": ["Selecting only one solution immediately", "Exploring multiple possible solutions", "Manufacturing the final product", "Measuring product sales"], "a": 1}, {"q": "Which of the following is an appropriate activity during the Prototype stage?", "o": ["Creating a simple representation of a proposed solution", "Writing the final business report", "Avoiding user interaction", "Defining the original problem"], "a": 0}, {"q": "Why is iteration important in Design Thinking?", "o": ["It allows the solution to be improved through repeated learning", "It prevents changes to the design", "It eliminates the need for testing", "It ensures that the first idea becomes the final solution"], "a": 0}, {"q": "Which of the following is an example of qualitative user research?", "o": ["Conducting an interview with a student", "Calculating the average attendance percentage", "Counting the number of computers", "Measuring network speed"], "a": 0}, {"q": "When observing users, a designer should primarily:", "o": ["Assume the reason behind every action", "Carefully notice user behavior and context", "Interrupt users frequently", "Suggest solutions immediately"], "a": 1}, {"q": "What is the main purpose of asking open-ended questions during user research?", "o": ["To obtain detailed responses and insights", "To force users to select one option", "To reduce user participation", "To confirm the designer's assumptions"], "a": 0}, {"q": "Which statement about empathy in Design Thinking is most appropriate?", "o": ["It means agreeing with every user opinion", "It helps designers understand users' experiences and perspectives", "It means designing without interacting with users", "It focuses only on emotional problems"], "a": 1}, {"q": "In an empathy map, the \"Feels\" section mainly captures:", "o": ["A user's emotional reactions", "The user's financial information", "The technical specifications of a product", "The designer's assumptions"], "a": 0}, {"q": "Which question is most useful for identifying a user's pain point?", "o": ["What difficulties do you experience while performing this task?", "Which programming language do you prefer?", "What is the product's manufacturing cost?", "Who designed the product?"], "a": 0}, {"q": "A problem statement in Design Thinking should generally be:", "o": ["Focused on a specific user need", "Written as a detailed technical solution", "Limited to one particular technology", "Based entirely on assumptions"], "a": 0}, {"q": "Which creative thinking technique involves changing or modifying an existing idea to develop a new possibility?", "o": ["SCAMPER", "Debugging", "Scheduling", "Classification"], "a": 0}, {"q": "What does the \"M\" in the SCAMPER technique represent?", "o": ["Modify", "Measure", "Manage", "Minimize"], "a": 0}, {"q": "Which technique encourages a person to generate ideas by looking at a problem from different viewpoints or roles?", "o": ["Six Thinking Hats", "Data normalization", "Flowcharting", "Benchmarking"], "a": 0}, {"q": "Which of the following is an important characteristic of effective creative thinking?", "o": ["Considering alternative perspectives", "Accepting the first idea without analysis", "Avoiding unusual possibilities", "Rejecting ideas before exploring them"], "a": 0}, {"q": "A university wants to improve its library service. Students complain that finding books is difficult, but observation shows that many students are actually confused by the location signs. Which conclusion demonstrates effective Design Thinking?", "o": ["Immediately develop a new library application", "Investigate the underlying user difficulty before selecting a solution", "Replace all library computers", "Ignore observations because students already provided feedback"], "a": 1}, {"q": "A design team interviews students and discovers that students request \"more charging points.\" However, observation reveals that the actual problem is that students cannot find available charging points when needed. Which insight is most useful?", "o": ["The solution must immediately be more charging points", "The underlying need should be investigated rather than accepting the stated solution", "Interviews should not be conducted", "Observation is unnecessary when users give suggestions"], "a": 1}, {"q": "During ideation, a team generates 50 possible solutions but initially evaluates none of them. Why can this approach be useful?", "o": ["It encourages divergent thinking before convergent selection", "It guarantees that every idea will be implemented", "It prevents creativity", "It eliminates the need for user research"], "a": 0}, {"q": "A team creates two low-cost prototypes for the same user problem and allows users to interact with both. What is the main advantage of this approach?", "o": ["It allows comparison and learning before investing heavily in one solution", "It guarantees that both prototypes will become final products", "It eliminates the need for user feedback", "It prevents further modification"], "a": 0}, {"q": "A designer believes that students dislike a particular college service. During interviews, students provide evidence that contradicts this belief. What should the designer do?", "o": ["Ignore the evidence and retain the original assumption", "Modify the understanding of the problem based on the evidence", "Stop the Design Thinking process", "Select a solution before collecting more information"], "a": 1}], "WDF": [{"q": "What is the main purpose of the World Wide Web?", "o": ["To provide access to interconnected web resources", "To replace computer hardware", "To store files only on local computers", "To control operating systems"], "a": 0}, {"q": "Which statement correctly distinguishes the Internet from the Web?", "o": ["The Internet and Web are exactly the same", "The Web is a service that operates over the Internet", "The Internet operates only through web browsers", "The Web does not require a network connection"], "a": 1}, {"q": "In the client-server model, which component usually requests a web resource?", "o": ["Server", "Database", "Client", "Router"], "a": 2}, {"q": "Which component is primarily responsible for responding to requests from clients?", "o": ["Server", "Browser cache", "Keyboard", "Monitor"], "a": 0}, {"q": "Which part of a URL identifies the communication protocol?", "o": ["Domain name", "Path", "Protocol scheme", "File name"], "a": 2}, {"q": "What is the main purpose of DNS?", "o": ["To encrypt web pages", "To translate domain names into IP addresses", "To create HTML documents", "To compress web files"], "a": 1}, {"q": "Which HTTP method is commonly used to retrieve data from a server?", "o": ["GET", "POST", "DELETE", "PATCH"], "a": 0}, {"q": "Which HTTP status code indicates that a requested resource was successfully returned?", "o": ["404", "500", "200", "301"], "a": 2}, {"q": "What does HTTP status code 404 generally indicate?", "o": ["Successful request", "Resource not found", "Server permanently stopped", "Authentication completed"], "a": 1}, {"q": "Which HTTP status code represents a server-side error?", "o": ["201", "301", "404", "500"], "a": 3}, {"q": "What is the primary function of a web browser?", "o": ["To compile operating systems", "To request, interpret, and display web resources", "To replace a web server", "To assign IP addresses"], "a": 1}, {"q": "Which tool in a modern browser is mainly used to inspect HTML and CSS and debug web pages?", "o": ["File Manager", "Calculator", "Developer Tools", "Media Player"], "a": 2}, {"q": "Which declaration is used to indicate that an HTML document uses HTML5?", "o": ["<!DOCTYPE html>", "<html5>", "<doctype html5>", "<html version=\"5\">"], "a": 0}, {"q": "Which HTML element contains metadata and information about the document?", "o": ["<body>", "<head>", "<main>", "<section>"], "a": 1}, {"q": "Which HTML element is used to create a hyperlink?", "o": ["<link>", "<href>", "<a>", "<url>"], "a": 2}, {"q": "Which attribute specifies the destination of a hyperlink?", "o": ["src", "alt", "href", "target"], "a": 2}, {"q": "Which HTML element is used to display an image?", "o": ["<image>", "<img>", "<picturebox>", "<src>"], "a": 1}, {"q": "Which attribute provides alternative text for an image?", "o": ["title", "href", "alt", "text"], "a": 2}, {"q": "Which HTML element creates an unordered list?", "o": ["<ol>", "<list>", "<li>", "<ul>"], "a": 3}, {"q": "Which HTML element is used to define a table row?", "o": ["<td>", "<tr>", "<th>", "<row>"], "a": 1}, {"q": "A user enters a domain name into a browser, and the browser needs to determine the server's IP address before establishing communication. Which process is primarily involved?", "o": ["HTML parsing", "DNS resolution", "CSS rendering", "Form validation"], "a": 1}, {"q": "A browser receives an HTML document from a server. Which sequence best represents the general rendering process?", "o": ["Render page → parse HTML → request document", "Parse HTML → construct page structure → apply styles → render", "Apply CSS → request DNS → parse HTML", "Render page → apply HTML → resolve domain name"], "a": 1}, {"q": "A developer wants a button on a webpage to submit form data to the server where the data should not normally appear in the URL query string. Which method is more appropriate?", "o": ["GET", "TRACE", "POST", "HEAD"], "a": 2}, {"q": "Which HTML structure provides the most semantic meaning for the main content of a webpage?", "o": ["Using only <div> elements", "Using <main> for the primary content", "Using <span> for all content", "Using <br> between sections"], "a": 1}, {"q": "A developer opens browser DevTools and changes CSS properties directly in the Elements panel. What is the main purpose of doing this?", "o": ["Permanently modifying the server-side HTML", "Testing visual changes interactively in the browser", "Changing the DNS records", "Installing a web server"], "a": 1}, {"q": "Which of the following is required for a client to communicate with a web server?", "o": ["Network connection", "Printer connection", "Spreadsheet software", "Image editor"], "a": 0}, {"q": "What does a web server generally do when it receives a valid client request?", "o": ["Deletes the browser", "Processes the request and sends an appropriate response", "Changes the client's operating system", "Creates a new IP address for every request"], "a": 1}, {"q": "Which part of a URL generally identifies the website's domain?", "o": ["Query string", "Fragment", "Domain name", "File extension"], "a": 2}, {"q": "In the URL https://example.com/products/item.html, what does /products/item.html represent?", "o": ["Protocol", "Path", "Domain", "Port"], "a": 1}, {"q": "Which HTTP method is generally associated with sending new data to a server?", "o": ["POST", "GET", "HEAD", "OPTIONS"], "a": 0}, {"q": "Which HTTP status code indicates a successful resource creation?", "o": ["200", "201", "404", "503"], "a": 1}, {"q": "What does an HTTP 301 response generally indicate?", "o": ["Temporary server failure", "Unauthorized access", "Permanent redirection", "Successful deletion"], "a": 2}, {"q": "Which status code belongs to the 4xx category?", "o": ["200", "301", "404", "500"], "a": 2}, {"q": "What is the primary role of DNS in web communication?", "o": ["Converting HTML into CSS", "Mapping human-readable domain names to network addresses", "Creating hyperlinks", "Rendering images"], "a": 1}, {"q": "Which browser component allows developers to view network requests made by a webpage?", "o": ["DevTools Network panel", "Address bar", "Bookmark manager", "History panel"], "a": 0}, {"q": "Which element represents the root of an HTML document?", "o": ["<body>", "<head>", "<html>", "<document>"], "a": 2}, {"q": "Which section normally contains the visible content displayed on a webpage?", "o": ["<meta>", "<body>", "<head>", "<title>"], "a": 1}, {"q": "Which HTML attribute is used to provide a unique identifier for an element?", "o": ["class", "name", "id", "type"], "a": 2}, {"q": "Which HTML element is normally used for the largest heading?", "o": ["<h6>", "<heading>", "<head>", "<h1>"], "a": 3}, {"q": "Which element represents an individual item in an HTML list?", "o": ["<li>", "<item>", "<list>", "<ul>"], "a": 0}, {"q": "Which HTML element is used to create a numbered list?", "o": ["<ul>", "<ol>", "<dl>", "<li>"], "a": 1}, {"q": "Which semantic element is most appropriate for a group of navigation links?", "o": ["<nav>", "<navigate>", "<links>", "<menuitem>"], "a": 0}, {"q": "Which HTML element is used to create a form?", "o": ["<input>", "<form>", "<fieldset>", "<submit>"], "a": 1}, {"q": "Which input type is most appropriate for allowing a user to select a date?", "o": ["text", "number", "date", "calendar"], "a": 2}, {"q": "Which HTML element is used to embed a video in a webpage?", "o": ["<movie>", "<media>", "<video>", "<film>"], "a": 2}, {"q": "A webpage contains a form with user information. The developer wants the submitted values to be included as parameters in the URL. Which HTTP method is generally appropriate?", "o": ["POST", "GET", "DELETE", "PATCH"], "a": 1}, {"q": "A developer wants to make a webpage more meaningful to search engines and assistive technologies. Which approach is most appropriate?", "o": ["Use semantic HTML elements where appropriate", "Use only <div> elements", "Replace headings with images", "Avoid structural elements"], "a": 0}, {"q": "A webpage contains a table where the first row contains headings such as \"Name\", \"Email\", and \"Department\". Which HTML element is most appropriate for these heading cells?", "o": ["<td>", "<tr>", "<th>", "<theadcell>"], "a": 2}, {"q": "A developer wants an image to remain understandable to users who cannot see the image. Which HTML feature should be used?", "o": ["href attribute", "alt attribute", "src attribute", "target attribute"], "a": 1}, {"q": "A browser loads an HTML page, but a developer wants to identify which resource is taking unusually long to load. Which DevTools feature would be most useful?", "o": ["Elements panel", "Network panel", "Console history", "Bookmarks panel"], "a": 1}], "IOT": [{"q": "What does IoT primarily refer to?", "o": ["Connecting physical objects to networks so they can collect and exchange data", "Connecting only computers to the Internet", "Developing only mobile applications", "Storing data only on personal computers"], "a": 0}, {"q": "Which of the following is an important characteristic of IoT?", "o": ["Devices operate without any communication", "Physical objects can sense, communicate, and exchange information", "IoT devices cannot interact with their environment", "IoT is limited to desktop computers"], "a": 1}, {"q": "Which of the following is a common real-world application of IoT?", "o": ["Smart home automation", "Traditional paper filing", "Manual typewriting", "Offline text editing"], "a": 0}, {"q": "What was one of the major ideas behind Machine-to-Machine communication?", "o": ["Enabling machines to exchange information with limited human intervention", "Connecting only humans through social media", "Replacing all sensors with computers", "Preventing machines from communicating"], "a": 0}, {"q": "How is modern IoT related to M2M communication?", "o": ["IoT completely eliminates machine communication", "M2M communication contributed to the development of connected IoT systems", "M2M and IoT have no relationship", "IoT existed before all forms of machine communication"], "a": 1}, {"q": "Which of the following is an important building block of an IoT ecosystem?", "o": ["Sensors", "Paper documents", "Typewriters", "Manual registers"], "a": 0}, {"q": "What is the primary function of a sensor in an IoT system?", "o": ["To physically move an object", "To detect or measure physical conditions", "To provide electrical power to every device", "To display web pages"], "a": 1}, {"q": "Which of the following can be measured using an IoT sensor?", "o": ["Temperature", "Programming language", "Database schema", "Source code"], "a": 0}, {"q": "What is the primary function of an actuator?", "o": ["To sense environmental conditions", "To store Internet addresses", "To perform a physical action based on "], "a": 2}, {"q": "In a smart lighting system, which component can switch a light ON or OFF based on a control signal?", "o": ["Sensor", "Actuator", "Gateway", "Network cable"], "a": 1}, {"q": "Which statement best describes the scope of IoT?", "o": ["It is limited to industrial machines", "It is limited to smart homes", "It can connect and monitor devices across areas such as healthcare, agriculture, industry, and transportation", "It is limited to personal computers"], "a": 2}, {"q": "A smart farming system measures soil moisture and sends the collected information to a remote application. Which sequence best represents the basic flow of information?", "o": ["Application → Sensor → Network", "Sensor → Network → Application", "Network → Sensor → Application", "Actuator → Application → Sensor"], "a": 1}, {"q": "An IoT device collects temperature data, but the device cannot directly communicate with a remote server because it uses a local communication technology. Which component can help connect the local IoT network to another network?", "o": ["Sensor", "Actuator", "Gateway", "Battery"], "a": 2}, {"q": "A system continuously monitors a patient's temperature and uses the collected information to trigger a cooling mechanism when required. Which combination correctly represents the sensing and action components?", "o": ["Sensor for measuring temperature and actuator for performing the physical action", "Actuator for measuring temperature and sensor for performing the physical action", "Gateway for measuring temperature and sensor for performing the physical action", "Microcontroller for measuring temperature and network for performing the physical action"], "a": 0}, {"q": "Which statement best explains the evolution from M2M communication to modern IoT?", "o": ["M2M focused on machine communication, while IoT extends connectivity into broader ecosystems involving devices, networks, data, and applications", "M2M was developed after modern IoT", "IoT removes the need f ysical sensor", "It provides only Internet access"], "a": 1}, {"q": "A smart building has temperature sensors, network connectivity, a gateway, and an application that allows administrators to monitor room conditions. Which statement is most accurate?", "o": ["The sensors belong to the application layer", "The gateway replaces the perception layer", "The system combines multiple IoT ecosystem components to provide an integrated service", "The application directly measures temperature without sensors"], "a": 2}, {"q": "A company wants to convert an isolated machine-monitoring system into a broader IoT solution. Which change would best represent this transition?", "o": ["Remove communication capabilities", "Connect devices with networks and integrate collected data with applications and services", "Replace sensors with manual inspection", "Prevent devices from exchanging information"], "a": 1}, {"q": "In a three-layer IoT architecture, a sensor detects temperature, a communication network transfers the reading, and a cloud-based application displays the temperature to a user. Which mapping is correct?", "o": ["Sensor – Application, Network – Perception, Cloud application – Network", "Sensor – Network, Network – Application, Cloud application – Perception", "Sensor – Perception, Network – Network, Cloud application – Application", "Sensor – Application, Network – Network, Cloud application – Perception"], "a": 2}], "DBMS": [{"q": "Which of the following is the primary purpose of a Database Management System?", "o": ["To increase data redundancy", "To manage and organize data efficiently", "To replace the operating system", "To increase processor speed"], "a": 1}, {"q": "Which of the following is a major disadvantage of the traditional file-processing system?", "o": ["Data redundancy", "Data independence", "Data abstraction", "Data security"], "a": 0}, {"q": "Which of the following is an advantage of a DBMS over a traditional file system?", "o": ["Increased data duplication", "Increased program-data dependency", "Improved data sharing and security", "Increased data inconsistency"], "a": 2}, {"q": "Who is primarily responsible for managing the database, defining access privileges, and maintaining database security?", "o": ["End User", "Application Programmer", "Database Administrator", "System Analyst"], "a": 2}, {"q": "In the three-level architecture of a DBMS, which level describes the overall logical structure of the database?", "o": ["External level", "Internal level", "Conceptual level", "Physical level"], "a": 2}, {"q": "Which data model represents data in the form of tables consisting of rows and columns?", "o": ["Hierarchical model", "Network model", "Relational model", "Object-oriented model"], "a": 2}, {"q": "Which data model organizes data in the form of a tree structure?", "o": ["Relational model", "Hierarchical model", "Network model", "Object-oriented model"], "a": 1}, {"q": "The actual data stored in a database at a particular point in time is called:", "o": ["Schema", "Instance", "Domain", "Attribute"], "a": 1}, {"q": "The overall logical structure or design of a database is known as:", "o": ["Instance", "Schema", "Tuple", "Relation"], "a": 1}, {"q": "Which type of data independence allows changes in the conceptual schema without requiring changes to external schemas?", "o": ["Physical data independence", "Logical data independence", "Storage independence", "Application independence"], "a": 1}, {"q": "Which DBMS language is used to create, alter, and delete database structures?", "o": ["DML", "DDL", "DCL", "TCL"], "a": 1}, {"q": "Which of the following is a DML command?", "o": ["CREATE", "GRANT", "INSERT", "COMMIT"], "a": 2}, {"q": "Which of the following is a DCL command?", "o": ["SELECT", "UPDATE", "GRANT", "COMMIT"], "a": 2}, {"q": "Which of the following is a TCL command?", "o": ["CREATE", "INSERT", "COMMIT", "GRANT"], "a": 2}, {"q": "In an ER model, an entity represents:", "o": ["A real-world object or concept" ation", "Aggregation", "Generalization hierarchy"], "a": 2}, {"q": "Which of the following is a collection of related data?", "o": ["Database", "Program", "Algorithm", "Compiler"], "a": 0}, {"q": "Data inconsistency occurs when:", "o": ["Multiple copies of data contain different values", "Data is stored only once", "Data is encrypted", "Data is normalized"], "a": 0}, {"q": "Which database user develops application programs that access the database?", "o": ["End User", "Application Programmer", "Database Administrator", "Data Analyst"], "a": 1}, {"q": "Which level of database architecture is closest to physical storage?", "o": ["External Level", "Conceptual Level", "Internal Level", "User Level"], "a": 2}, {"q": "Which data model allows a record to have multiple parent records?", "o": ["Hierarchical Model", "Network Model", "Relational Model", "Object Model"], "a": 1}, {"q": "A row in a relational table is also known as:", "o": ["Attribute", "Tuple", "Domain", "Schema"], "a": 1}, {"q": "Which term refers to the set of allowable values for an attribute?", "o": ["Domain", "Relation", "Tuple", "Entity"], "a": 0}, {"q": "Which command is used to remove a table structure from a database?", "o": ["DELETE", "REMOVE", "DROP", "ERASE"], "a": 2}, {"q": "Which DML command is used to modify existing records?", "o": ["ALTER", "UPDATE", "CREATE", "GRANT"], "a": 1}, {"q": "Which command permanently saves a transaction?", "o": ["COMMIT", "ROLLBACK", "REVOKE", "SAVEPOINT"], "a": 0}, {"q": "In an ER diagram, relationships are represented by:", "o": ["Rectangles", "Ovals", "Diamonds", "Circles"], "a": 2}, {"q": "An attribute that can be divided into smaller subparts is called:", "o": ["Composite Attribute", "Derived Attribute", "Multivalued Attribute", "Key Attribute"], "a": 0}, {"q": "Which attribute can have multiple values for a single entity?", "o": ["Simple Attribute", "Composite Attribute", "Derived Attribute", "Multivalued Attribute"], "a": 3}, {"q": "Which relationship degree involves three entity sets?", "o": ["Unary", "Binary", "Ternary", "Recursive"], "a": 2}, {"q": "Specialization is a process of:", "o": ["Combining lower-level entities into a higher-level entity", "Dividing a higher-level entity into lower-level entities", "Removing attributes from entities", "Creating new tables"], "a": 1}, {"q": "Generalization is the reverse process of:", "o": ["Aggregation", "Normalization", "Specialization", "Mapping"], "a": 2}, {"q": "Which relational algebra operation combines tuples from two relations?", "o": ["Join", "Selection", "Projection", "Division"], "a": 0}, {"q": "Which key is chosen from candidate keys to uniquely identify records?", "o": ["Foreign Key", "Alternate Key", "Candidate Key", "Primary Key"], "a": 3}, {"q": "A candidate key that is not selected as the primary key is called:", "o": ["Alternate Key", "Foreign Key", "Composite Key", "Super Key"], "a": 0}, {"q": "Which rule states that information must be represented only as values in tables?", "o": ["Codd Rule 0", "Information Rule", "Access Rule", "Integrity Rule"], "a": 1}, {"q": "Consider an entity EMPLOYEE with attributes Employee_ID, Name, Salary, and Department. Which attribute is most suitable as a primary key?", "o": ["Name", "Salary", "Department", "Employee_ID"], "a": 3}, {"q": "A company stores customer information in one table and order information in another table. The Customer_ID field is used to connect both tables. Customer_ID in the Orders table is:", "o": ["Candidate Key", "Foreign Key", "Super Key", "Alternate Key"], "a": 1}, {"q": "In an ER model, a relationship \"Works_On\" between EMPLOYEE and PROJECT has attributes Hours_Worked and Role. If this relationship must participate in another relationship, which concept should be used?", "o": ["Aggregation", "Specialization", "Generalization", "Normalization"], "a": 0}, {"q": "Which relational algebra operation returns only specified columns from a relation?", "o": ["Join", "Selection", "Projection", "Union"], "a": 2}, {"q": "A student can enroll in many courses, and each course can have many students. This relationship is best represented as:", "o": ["One-to-One", "One-to-Many", "Many-to-One", "Many-to-Many"], "a": 3}]};
const subjectNames = {"IDT": "Innovation & Design Thinking", "WDF": "Web Fundamentals and HTML", "IOT": "Internet of Things", "DBMS": "Database Management System"};

let currentBank = [];
let currentIndex = 0;
let score = 0;
let answered = new Set();
let selectedSubject = "";

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startStudy() {
  selectedSubject = document.getElementById("subjectSelect").value;
  if (!selectedSubject) {
    alert("Please select a subject.");
    return;
  }
  currentBank = shuffle(banks[selectedSubject]);
  currentIndex = 0;
  score = 0;
  answered = new Set();
  document.getElementById("studyCard").classList.remove("hidden");
  showQuestion();
  window.scrollTo({top: document.getElementById("studyCard").offsetTop - 15, behavior: "smooth"});
}

function showQuestion() {
  if (!currentBank.length) return;

  const item = currentBank[currentIndex];
  document.getElementById("subjectName").textContent = subjectNames[selectedSubject];
  document.getElementById("progress").textContent =
    `Question ${currentIndex + 1} of ${currentBank.length} | Score: ${score}`;
  document.getElementById("fill").style.width =
    ((currentIndex + 1) / currentBank.length * 100) + "%";
  document.getElementById("question").textContent = item.q;

  const options = document.getElementById("options");
  options.innerHTML = "";

  item.o.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = String.fromCharCode(65 + i) + ". " + opt;
    btn.onclick = () => checkAnswer(i, btn);
    options.appendChild(btn);
  });

  const f = document.getElementById("feedback");
  f.className = "feedback";
  f.textContent = "";
}

function checkAnswer(choice, clicked) {
  const item = currentBank[currentIndex];
  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);

  if (choice === item.a) {
    clicked.classList.add("correct");
    if (!answered.has(currentIndex)) {
      score++;
      answered.add(currentIndex);
    }
    showFeedback("Correct Answer: " + String.fromCharCode(65 + item.a), true);
  } else {
    clicked.classList.add("wrong");
    buttons[item.a].classList.add("correct");
    showFeedback("Correct Answer: " + String.fromCharCode(65 + item.a), false);
  }

  document.getElementById("progress").textContent =
    `Question ${currentIndex + 1} of ${currentBank.length} | Score: ${score}`;
}

function showFeedback(text, correct) {
  const f = document.getElementById("feedback");
  f.className = "feedback show " + (correct ? "correct" : "wrong");
  f.textContent = text;
}

function nextQuestion() {
  if (!currentBank.length) return;
  if (currentIndex < currentBank.length - 1) {
    currentIndex++;
    showQuestion();
  } else {
    alert("You have completed this study session. Score: " + score + " out of " + currentBank.length + ".");
  }
}

function previousQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    showQuestion();
  }
}
</script>
